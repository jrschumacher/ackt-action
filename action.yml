name: "ackt author attestation"
description: >-
  Posts the ackt attest link on a pull request and asks the ackt service
  whether the PR author has attested to the current head SHA, posting the
  result as the ackt / human-review status check. No App, no webhooks —
  see docs/superpowers/specs/2026-08-08-no-app-design.md.
  REQUIRES "permissions: id-token: write" in the calling workflow — the
  action authenticates to the ackt service with a GitHub Actions OIDC
  token and fails the step without one. Also use
  "actions/checkout@v4 with: fetch-depth: 0" — the action resolves the
  pull request's real head from the GitHub API and fetches that exact
  commit itself, so no explicit "ref:" is needed, but fetch-depth: 0
  still is: it supplies the history between the commits the action
  fetches — see README.md.
author: "aboldnewlook"

branding:
  icon: "shield"
  color: "green"

# There is deliberately no `permissions:` key here — Actions metadata has no
# such field. Permissions are granted by the *consumer's* workflow file, so
# `id-token: write` is documented (in `description` above and in README.md)
# and enforced at runtime: src/oidc.ts fails the step, naming the permission
# and the workflow file, when the runner exposed no OIDC endpoint.

inputs:
  service:
    description: >-
      Base URL of the ackt service to query and link to.
    required: false
    default: "https://ackt.dev"
  fail-on-unattested:
    description: >-
      When "true", the job fails if the PR author has not attested the
      current head. When "false" (the default), the job always succeeds and
      only the ackt / human-review status reflects attestation state, so
      adopting this action never breaks CI for repos still evaluating ackt.
      policy-bot (or any other consumer) should read the status check, not
      this job's outcome.
    required: false
    default: "false"
  github-token:
    description: >-
      Token used to read the pull request, post the comment, post the
      status check, and add reactions. The default workflow token is
      sufficient.
    required: false
    default: ${{ github.token }}

outputs:
  attested:
    description: '"true" or "false" — whether the PR author has attested the current head. Only set when the event was a trigger; see the "acted" output.'
  acted:
    description: '"true" or "false" — whether this run was a recognized trigger at all (see trigger.ts). Most issue_comment events are not.'

runs:
  using: "node20"
  main: "dist/index.js"
